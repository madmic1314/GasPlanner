name: Publish fork to GitHub Pages

# Builds this fork and publishes it to the gh-pages branch,
# so it can be installed as a PWA from https://<owner>.github.io/<repository>/.
# Never runs in the upstream repository, which has its own deploy in main.yml.

on:
  push:
    branches:
      - feat/icd-points-over-limit
  workflow_dispatch:

concurrency:
  group: fork-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Test, build and publish
    if: github.repository != 'jirkapok/GasPlanner'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --legacy-peer-deps

      # Runs the library and application unit tests and installs the built library.
      # A failing test stops the publish.
      - name: Unit tests
        run: pwsh ./build/test.ps1

      # The site is served from a sub folder, not from the domain root.
      - name: Build application
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Publish to gh-pages branch
        working-directory: dist/planner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp index.html 404.html
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
